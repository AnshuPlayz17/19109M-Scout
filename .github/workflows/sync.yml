# Pulls RobotEvents data into the scouting app. This repo is public, so Actions minutes are free.
name: Scout sync

on:
  schedule:
    - cron: "41 * * * *"   # hourly backup; normally each run starts the next one (always on: every 2 s on match days, 3 s otherwise)
    - cron: "17 7 * * *"   # nightly full refresh (3am Toronto)
  workflow_dispatch:
    inputs:
      mode:
        description: "quick or full"
        default: full
        type: choice
        options: [quick, full]
      game:
        description: "override (this season) or pushback (last season)"
        default: override
        type: choice
        options: [override, pushback]

concurrency:
  group: scout-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Always on (config.json alwaysOn): a run checks every few seconds for just under 6 hours (GitHub's
    # job limit), then the last step starts the next run. The hourly schedule is the backup;
    # a queued backup run that's no longer needed shows as cancelled, which is harmless.
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v5
      - name: Check secrets
        working-directory: .
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ROBOTEVENTS_TOKEN: ${{ secrets.ROBOTEVENTS_TOKEN }}
          TEAM_JOIN_CODE: ${{ secrets.TEAM_JOIN_CODE }}
        run: |
          missing=""
          for n in FIREBASE_SERVICE_ACCOUNT ROBOTEVENTS_TOKEN TEAM_JOIN_CODE; do [ -z "${!n}" ] && missing="$missing $n"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions (steps in README.md)."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Sync
        run: node sync.mjs
        env:
          SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '17 7 * * *' && 'full' || 'quick' }}
          SYNC_GAME: ${{ github.event_name == 'workflow_dispatch' && inputs.game || 'override' }}
          ROBOTEVENTS_TOKEN: ${{ secrets.ROBOTEVENTS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEAM_JOIN_CODE: ${{ secrets.TEAM_JOIN_CODE }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Start the next run (always on)
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('config.json', 'utf8')).alwaysOn ? 0 : 1)"; then
            gh workflow run sync.yml --ref "${{ github.ref_name }}" -f mode=quick -f game=override
          fi
