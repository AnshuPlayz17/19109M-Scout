<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">
<script>
  // The theme chosen in Settings (Light / Dark), applied before anything draws. System = no attribute.
  try { const t = JSON.parse(localStorage.getItem("19109m.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="19109M Scout">
<title>19109M Scout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Start every download at once instead of one after another. -->
<link rel="modulepreload" href="fb.js">
<link rel="modulepreload" href="firebase-config.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js" crossorigin>
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-sc-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
  /* Loading screen: shown until the app has signed in and drawn its first page. Colours come from style.css. */
  #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: var(--bg, #f2f3f5); color: var(--fg, #14161a); font: 16px/1.4 var(--font, system-ui, sans-serif); transition: opacity 0.3s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .mark { width: 64px; height: 64px; border-radius: 16px; background: var(--accent, #c8282d); color: #fff; display: grid; place-items: center; font: 700 2.25rem/1 var(--font-num, system-ui, sans-serif); }
  #splash .name { font: 700 1.75rem/1 var(--font-num, system-ui, sans-serif); }
  #splash .name span { color: var(--muted, #5f6670); font: 500 1.125rem/1 var(--font, system-ui, sans-serif); margin-left: 4px; }
  #splash .bar { width: 120px; height: 3px; border-radius: 2px; background: var(--surface-3, #e3e5e9); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--accent, #c8282d); animation: slide 1.1s ease-in-out infinite; }
  #splash .msg { font-size: 0.8125rem; color: var(--muted, #5f6670); min-height: 1.2em; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; } }
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="mark" aria-hidden="true">M</div>
  <div class="name">19109M <span>Scout</span></div>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="msg" id="splash-msg">Loading…</div>
</div>
<div id="app"></div>
<script type="module" src="app.js"></script>
<noscript>This app needs JavaScript.</noscript>
</body>
</html>
