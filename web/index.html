<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="19109M Scout">
<title>19109M Scout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Start every download at once instead of one after another. -->
<link rel="modulepreload" href="fb.js">
<link rel="modulepreload" href="firebase-config.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jakarta.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bebas.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
  @font-face { font-family: "Bebas Neue"; src: url("fonts/bebas.woff2") format("woff2"); font-display: swap; }
  /* Loading screen: shown until the app has signed in and drawn its first page. */
  #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #f2f2f7; color: #111114; font: 17px/1.4 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: opacity 0.3s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .mark { width: 76px; height: 76px; border-radius: 18px; background: #c8282d; color: #fff; display: grid; place-items: center; font-family: "Bebas Neue", sans-serif; font-size: 2.75rem; letter-spacing: 0.01em;
    animation: breathe 1.6s ease-in-out infinite; }
  #splash .name { font-family: "Bebas Neue", sans-serif; font-size: 2rem; letter-spacing: 0.02em; margin-top: -4px; }
  #splash .name span { color: #5f6068; font-weight: 500; }
  #splash .bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(60, 60, 67, 0.15); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #c8282d; animation: slide 1.1s ease-in-out infinite; }
  #splash .msg { font-size: 0.8125rem; color: #5f6068; min-height: 1.2em; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @keyframes breathe { 50% { transform: scale(0.96); } }
  @media (prefers-color-scheme: dark) {
    #splash { background: #000; color: #f5f5f7; } #splash .name span, #splash .msg { color: #a1a1aa; }
    #splash .mark { background: #e0474c; } #splash .bar { background: rgba(255, 255, 255, 0.15); } #splash .bar i { background: #e0474c; }
  }
  @media (prefers-reduced-motion: reduce) { #splash .mark, #splash .bar i { animation: none; } }
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="mark" aria-hidden="true">M</div>
  <div class="name">19109M <span>Scout</span></div>
  <div class="bar" aria-hidden="true"><i></i></div>
  <div class="msg" id="splash-msg">Loading…</div>
</div>
<div id="app"></div>
<script type="module" src="app.js"></script>
<noscript>This app needs JavaScript.</noscript>
</body>
</html>
